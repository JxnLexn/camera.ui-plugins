name: Catalog

on:
  push:
    branches: [main]
    paths:
      - "scripts/catalog.ts"
      - "camera-ui-*/package.json"
      - "camera-ui-*/contract.ts"
      - "camera-ui-*/logo.png"
      - "camera-ui-*/screenshots/**"
  workflow_run:
    workflows: [Release]
    types: [completed]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  catalog:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install
        run: npm ci --ignore-scripts

      - name: Generate catalog.json
        run: npm run catalog

      - name: Commit when it changed
        run: |
          if git diff --quiet -- catalog.json; then
            echo "catalog.json is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git commit -m "chore: update catalog"
          git push origin HEAD:main
